<!DOCTYPE html>
<html lang="en">

{% include "include/head.html" %}

<body class="bg-body-tertiary">

{% include "include/nav.html" %}

{#Body#}

<div id="member-list" class="container">
	{% if title %}
	<h1 class="title card-text py-3 fw-semibold">{{ title }}</h1>
	{% endif %}
	<div class="row">
		{% for m in members %}
			<div class="col-12 col-sm-6 col-lg-4 col-xl-4">
				<a href="/user/{{ m['uid'] }}" class="profile-link">
					<div class="card card-custom-wide mb-3 shadow-sm">
						<div class="card-custom-wide-img">
							<div class="card-custom-avatar">
								<img class="img-fluid card-profile-pic card-img-top card-img-top-crop" src="/image/{{ m['uid'] }}" alt="Avatar" loading="lazy" data-adaptive-background>
							</div>
					</div>
					<div class="card-body">
							<div class="text-center">
								<h2 class="card-title">{{ m['cn'] }}</h2>
								<h6 class="card-subtitle mb-2 text-muted">
									{{ m['uid'] }}
								</h6>
							</div>
						</div>
					</div>
				</a>
			</div>
		{% endfor %}
	</div>
</div>

{% include "include/footer.html" %}

{% include "include/scripts.html" %}

</body>

</html>
